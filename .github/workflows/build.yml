name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-baseline:
    name: Verify pinned AltTab source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test checkout protection
        run: python3 -m unittest discover -s Tests -p 'test_alt_tab_baseline.py'
      - name: Fetch and verify pinned upstream
        run: python3 scripts/alt_tab_baseline.py --fetch

  build:
    name: Build on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Build and verify local signature
        run: python3 build.py --output dist
